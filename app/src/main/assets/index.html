<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sigil</title>
<style>
:root{--bg:#07060c;--fg:#e9e4d4;--dim:#8d8799;--gold:#d9b26a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%}
#top{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;pointer-events:none}
#top b{display:block;font-weight:400;letter-spacing:.5em;font-size:13px;color:var(--gold);text-transform:uppercase}
#top span{display:block;margin-top:6px;font-size:13px;color:var(--dim);min-height:16px}
#ui{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px}
#ch{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:0 14px;box-sizing:border-box;scrollbar-width:none}
.r{display:flex;gap:8px}
.c{flex:none;font:inherit;font-size:12px;letter-spacing:.08em;color:var(--dim);background:none;border:1px solid rgba(141,135,153,.35);border-radius:999px;padding:6px 12px}
.c.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.b{font:inherit;font-size:13px;letter-spacing:.06em;color:var(--fg);background:rgba(217,178,106,.08);border:1px solid rgba(217,178,106,.45);border-radius:999px;padding:10px 14px}
.b:active{background:rgba(217,178,106,.25)}
input{display:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="top"><b>Sigil</b><span id="n">Choose a track to begin</span><span id="i"></span></div>
<div id="ui"><div id="ch"></div><div class="r"><label class="b">Open track<input id="f" type="file" accept="audio/*"></label><button class="b" id="d">Demo</button><button class="b" id="m">Mic</button><button class="b" id="p">Pause</button></div></div>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),ctx=cv.getContext('2d');
const mem=document.createElement('canvas');mem.width=mem.height=1200;const m=mem.getContext('2d');
const R=104,PHI=1.618034,TAU=Math.PI*2,GA=2.399963;
const pts=[];for(let q=-4;q<=4;q++)for(let r=-4;r<=4;r++)if(Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=4)pts.push([R*(q+r/2),R*r*.866025]);
const dist=a=>Math.round(Math.hypot(a[0],a[1]));
pts.sort((a,b)=>dist(a)-dist(b)||Math.atan2(a[1],a[0])-Math.atan2(b[1],b[0]));
const MP=[[0,0]];for(const d of[150,300])for(let i=0;i<6;i++)MP.push([d*Math.cos(i*TAU/6),d*Math.sin(i*TAU/6)]);
const MPR=[];for(let i=0;i<13;i++)for(let j=i+1;j<13;j++)MPR.push([i,j]);
// just-intonation ratios for the 12 semitone intervals
const JR=[[1,1],[16,15],[9,8],[6,5],[5,4],[4,3],[45,32],[3,2],[8,5],[5,3],[16,9],[15,8]];
const MODES=['Mandala','Phyllotaxis','Harmonic','Cymatic','Metatron','Flower of Life'];
let gm=0,sym=7;
MODES.forEach((n,i)=>{const b=document.createElement('button');b.className='c'+(i?'':' on');b.textContent=n;
 b.onclick=()=>{gm=i;[...$('#ch').children].forEach((x,j)=>x.classList.toggle('on',j==i));rebuild()};$('#ch').append(b)});
let W,H,dpr;function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',size);size();

let ac,an,out,bus,el,F,prev,pcOf,src,timer,step=0,t0=0,noiseBuf,mic,px=NaN,py=0,ht=0,ph=0,lastD=-1;
const C=new Float32Array(12),K=new Float32Array(12);
let k=0,h=0,sn=0,ev=[],hue=40,pulse=0,lvl=0,frame=0,keyTxt='',bpm=0,times=[],cf=300;
const bands={lo:{avg:0,t:0,gap:.14},mid:{avg:0,t:0,gap:.12},hi:{avg:0,t:0,gap:.06}};
const info=()=>{$('#i').textContent=keyTxt+(bpm?' · ~'+bpm+' BPM':'')};
function rebuild(){m.setTransform(1,0,0,1,0,0);m.clearRect(0,0,1200,1200);k=h=sn=0;px=NaN;
 if(gm!=2&&gm!=3)for(const e of ev)place(...e)}
function reset(){ev=[];K.fill(0);times=[];keyTxt='';bpm=0;sym=7;frame=0;$('#i').textContent='';rebuild()}
reset();

function init(){if(ac)return;ac=new AudioContext();an=ac.createAnalyser();an.fftSize=4096;an.smoothingTimeConstant=.5;
 bus=ac.createGain();out=ac.createGain();bus.connect(an);an.connect(out);out.connect(ac.destination);
 F=new Uint8Array(an.frequencyBinCount);prev=new Uint8Array(F.length);
 const hz=ac.sampleRate/an.fftSize;pcOf=new Int8Array(F.length).fill(-1);
 for(let i=1;i<F.length;i++){const f=i*hz;if(f>65&&f<2100)pcOf[i]=((Math.round(69+12*Math.log2(f/440))%12)+12)%12}
 el=new Audio();ac.createMediaElementSource(el).connect(bus);
 el.onended=()=>{$('#i').textContent=keyTxt+(bpm?' · ~'+bpm+' BPM':'')+' · complete';$('#p').textContent='Play'};
 noiseBuf=ac.createBuffer(1,ac.sampleRate*.3,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function stopAll(){clearInterval(timer);timer=null;if(el)el.pause();if(mic){mic.getTracks().forEach(t=>t.stop());mic=null}out.gain.value=1}
const playing=()=>src=='file'?!el.paused:src=='demo'?!!timer:src=='mic'?!!mic&&ac.state=='running':false;
const lab=()=>setTimeout(()=>$('#p').textContent=playing()?'Pause':'Play',60);

$('#f').onchange=e=>{const f=e.target.files[0];if(!f)return;init();ac.resume();stopAll();src='file';t0=ac.currentTime;reset();
 el.src=URL.createObjectURL(f);el.play();$('#n').textContent=f.name.replace(/\.[^.]+$/,'');lab()};
$('#d').onclick=()=>{init();ac.resume();stopAll();src='demo';step=0;t0=ac.currentTime;reset();
 timer=setInterval(tick,150);$('#n').textContent='Demo · Am – F – C – G';lab()};
$('#m').onclick=async()=>{init();await ac.resume();stopAll();
 try{mic=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}
 catch(e){$('#n').textContent='Microphone not allowed';return}
 ac.createMediaStreamSource(mic).connect(bus);out.gain.value=0;src='mic';t0=ac.currentTime;reset();$('#n').textContent='Listening…';lab()};
$('#p').onclick=()=>{if(!ac)return;
 if(src=='file')el.paused?el.play():el.pause();
 else if(src=='demo'){if(timer){clearInterval(timer);timer=null}else timer=setInterval(tick,150)}
 else if(src=='mic'){ac.state=='running'?ac.suspend():ac.resume()}
 lab()};

function env(t,v,dur,node){const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);node.connect(g);g.connect(bus);return g}
function tone(t,f,dur,v=.1){const o=ac.createOscillator();o.type='triangle';o.frequency.value=f;env(t,v,dur,o);o.start(t);o.stop(t+dur)}
function noise(t,f,dur,v,type){const s=ac.createBufferSource();s.buffer=noiseBuf;const b=ac.createBiquadFilter();b.type=type;b.frequency.value=f;s.connect(b);env(t,v,dur,b);s.start(t)}
function tick(){const t=ac.currentTime+.05,s=step++;
 if(s%4==0){const o=ac.createOscillator();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);env(t,.9,.3,o);o.start(t);o.stop(t+.3)}
 if(s%2==1)noise(t,7000,.05,.12,'highpass');
 if(s%8==4)noise(t,1800,.15,.35,'bandpass');
 if(s%16==0){const ch=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]][(s/16)%4|0];ch.forEach(n=>tone(t,440*2**((n-69)/12),2.2));tone(t,440*2**((ch[0]-24-69)/12),1.6,.2)}
 if(s%4==2){const sc=[69,72,76,79,81];tone(t,440*2**((sc[Math.random()*5|0]-69)/12),.5,.06)}}

// Krumhansl–Schmuckler key finding
const MAJ=[6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],MIN=[6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];
const NOTES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
function corr(a,b,r){let ma=0,mb=0;for(let i=0;i<12;i++){ma+=a[(i+r)%12];mb+=b[i]}ma/=12;mb/=12;let n=0,da=0,db=0;
 for(let i=0;i<12;i++){const x=a[(i+r)%12]-ma,y=b[i]-mb;n+=x*y;da+=x*x;db+=y*y}return n/Math.sqrt(da*db||1)}
function findKey(){let best=-2,txt='';for(let r=0;r<12;r++){const a=corr(K,MAJ,r),b=corr(K,MIN,r);if(a>best){best=a;txt=NOTES[r]+' major'}if(b>best){best=b;txt=NOTES[r]+' minor'}}return txt}

function prog(){if(!ac)return 0;if(src=='file'&&el.duration)return el.currentTime/el.duration;return((ac.currentTime-t0)/(src=='demo'?9.6:120))%1}
function flux(a,b){let s=0;for(let i=a;i<b;i++){const d=F[i]-prev[i];if(d>0)s+=d}return s/(b-a)}
function onset(bd,v,now){const tr=v>bd.avg*1.7+3&&now-bd.t>bd.gap;bd.avg=bd.avg*.9+v*.1;if(tr)bd.t=now;return tr}
function emit(t){const pr=prog();if(ev.length<6000)ev.push([t,hue,lvl,pr]);if(gm!=2&&gm!=3)place(t,hue,lvl,pr)}
function analyse(){
 an.getByteFrequencyData(F);const hz=ac.sampleRate/an.fftSize,B=f=>Math.round(f/hz),now=ac.currentTime;
 const ch=new Float32Array(12);let mx=0,sum=0,sw=0;
 for(let i=0;i<F.length;i++){sum+=F[i];sw+=i*F[i];const p=pcOf[i];if(p>=0)ch[p]+=(F[i]/255)**2}
 lvl+=(sum/F.length/120-lvl)*.2;if(sum>0)cf=sw/sum*hz;
 for(let i=0;i<12;i++)mx=Math.max(mx,ch[i]);
 if(mx>.05){let dom=0;for(let i=0;i<12;i++){C[i]+=(ch[i]/mx-C[i])*.2;K[i]+=C[i];if(C[i]>C[dom])dom=i}hue=dom*30}
 if(onset(bands.lo,flux(B(30),B(150)),now)&&lvl>.02){pulse=1;times.push(now);if(times.length>16)times.shift();
  if(times.length>4){const d=[];for(let i=1;i<times.length;i++){const x=times[i]-times[i-1];if(x>.25&&x<1.2)d.push(x)}
   if(d.length>2){d.sort((a,b)=>a-b);let b=60/d[d.length>>1];while(b<70)b*=2;while(b>175)b/=2;bpm=Math.round(b)}}
  emit(0)}
 if(onset(bands.mid,flux(B(150),B(2500)),now))emit(1);
 if(onset(bands.hi,flux(B(5000),B(14000)),now))emit(2);
 prev.set(F);
 if(++frame%45==0&&mx>.05){keyTxt=findKey();info()}
 // symmetry order = number of pitch classes the track really uses (its scale size)
 if(frame%120==0&&frame>300){let km=0;for(const v of K)km=Math.max(km,v);let n=0;for(const v of K)if(v>.6*km)n++;
  n=Math.max(5,Math.min(12,n));if(n!=sym){sym=n;if(gm==0)rebuild()}}}

function place(t,hu,lv,pr){
 m.setTransform(1,0,0,1,600,600);lv=Math.min(1,lv);
 const c=(a,l=65)=>`hsla(${hu},75%,${l}%,${a})`;
 if(t==0)k++;else if(t==1)sn++;else h++;
 if(gm==0){const N=sym,r=50+pr*470;
  for(let i=0;i<N;i++){m.save();m.rotate(i*TAU/N);
   if(t==0){const L=16+lv*46,w=5+lv*20;m.strokeStyle=c(.6);m.lineWidth=1.2;m.beginPath();m.moveTo(r,0);m.quadraticCurveTo(r+L/2,w,r+L,0);m.quadraticCurveTo(r+L/2,-w,r,0);m.stroke()}
   else if(t==1){const a=2*TAU/N;m.strokeStyle=c(.3,70);m.lineWidth=.8;m.beginPath();m.moveTo(r,0);m.lineTo(r*Math.cos(a),r*Math.sin(a));m.stroke()}
   else{const a=((h*.618)%1)*Math.PI/N;m.fillStyle=c(.9,78);for(const s of[a,-a]){m.beginPath();m.arc(r*1.04*Math.cos(s),r*1.04*Math.sin(s),2,0,TAU);m.fill()}}
   m.restore()}}
 else if(gm==1){const i=(k+sn+h)%900,a=i*GA,rr=16*Math.sqrt(i);m.fillStyle=c(.85,t==2?80:65);m.beginPath();m.arc(rr*Math.cos(a),rr*Math.sin(a),t==0?3.5+lv*6:t==1?3:1.6,0,TAU);m.fill()}
 else if(gm==4){
  if(t==0){const p=MP[(k-1)%13];m.strokeStyle=c(.6);m.lineWidth=1.3;m.beginPath();m.arc(p[0],p[1],64,0,TAU);m.stroke()}
  else if(t==1){const q=MPR[(sn-1)%78],a=MP[q[0]],b=MP[q[1]];m.strokeStyle=c(.3,70);m.lineWidth=.8;m.beginPath();m.moveTo(a[0],a[1]);m.lineTo(b[0],b[1]);m.stroke()}
  else{const p=MP[(h-1)%13];m.fillStyle=c(.9,80);m.beginPath();m.arc(p[0],p[1],2.6,0,TAU);m.fill()}}
 else if(gm==5){
  if(t==0){m.lineWidth=1.2;m.strokeStyle=c(.4);m.beginPath();
   if(k<=61)m.arc(pts[k-1][0],pts[k-1][1],R,0,TAU);
   else{const j=k-62,n=3+j%10,rot=j*.1;m.arc(0,0,5*R/PHI**(1+j%5),0,TAU);m.moveTo(5*R*Math.cos(rot),5*R*Math.sin(rot));for(let i=1;i<=n;i++)m.lineTo(5*R*Math.cos(rot+i*TAU/n),5*R*Math.sin(rot+i*TAU/n))}
   m.stroke()}
  else if(t==2){const n=Math.max(1,Math.min(k,61)),p=pts[(h*7)%n];m.fillStyle=c(.9,75);m.beginPath();m.arc(p[0],p[1],3,0,TAU);m.fill()}
  else{const n=Math.max(2,Math.min(k,61)),a=pts[(sn*5)%n],b=pts[(sn*5+(n>>1)+1)%n];m.lineWidth=.8;m.strokeStyle=c(.22,70);m.beginPath();m.moveTo(a[0],a[1]);m.lineTo(b[0],b[1]);m.stroke()}}}

// Harmonograph: the two strongest notes form a just-intonation ratio that drives a Lissajous trace
function harm(){const o=[...Array(12).keys()].sort((a,b)=>C[b]-C[a]),d=(o[1]-o[0]+12)%12,[nu,de]=JR[d];
 if(d!=lastD){lastD=d;px=NaN}
 const A=500*(1-prog()*.5);m.setTransform(1,0,0,1,600,600);m.strokeStyle=`hsla(${hue},75%,68%,.3)`;m.lineWidth=1;m.beginPath();
 for(let s=0;s<60;s++){ht+=.006;ph+=.00004*nu;const x=A*Math.sin(nu*ht+ph),y=A*Math.sin(de*ht);
  if(!isNaN(px)){m.moveTo(px,py);m.lineTo(x,y)}px=x;py=y}m.stroke()}

// Cymatics: Chladni plate pattern cos(nπx)cos(mπy) − cos(mπx)cos(nπy) = 0, mode numbers follow pitch and brightness
const Z=128,cc=document.createElement('canvas');cc.width=cc.height=Z;const cx2=cc.getContext('2d'),im=cx2.createImageData(Z,Z);
const mask=new Float32Array(Z*Z);for(let y=0;y<Z;y++)for(let x=0;x<Z;x++){const r=Math.hypot(2*(x+.5)/Z-1,2*(y+.5)/Z-1);mask[y*Z+x]=r>1?0:r>.96?(1-r)/.04:1}
let cn=3,cm=5;
function chl(){const tn=2+(hue/30)/12*6,tm=3+5*Math.max(0,Math.min(1,Math.log2(Math.max(cf,200)/200)/4.3));cn+=(tn-cn)*.05;cm+=(tm-cm)*.05;
 const sh=80-50*pulse,d=im.data;
 for(let y=0;y<Z;y++)for(let x=0;x<Z;x++){const X=(x+.5)/Z,Y=(y+.5)/Z,i=(y*Z+x)*4,
  f=Math.cos(cn*Math.PI*X)*Math.cos(cm*Math.PI*Y)-Math.cos(cm*Math.PI*X)*Math.cos(cn*Math.PI*Y);
  d[i]=d[i+1]=d[i+2]=255;d[i+3]=Math.exp(-f*f*sh)*mask[y*Z+x]*255}
 cx2.putImageData(im,0,0);cx2.globalCompositeOperation='source-in';cx2.fillStyle=`hsl(${hue},75%,70%)`;cx2.fillRect(0,0,Z,Z);cx2.globalCompositeOperation='source-over';
 ctx.imageSmoothingEnabled=true;ctx.drawImage(cc,-520,-520,1040,1040)}

function draw(){
 ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
 const s=Math.min(W,H*.8)/1200*dpr;ctx.setTransform(s,0,0,s,W/2*dpr,H*.47*dpr);
 const g=ctx.createRadialGradient(0,0,0,0,0,600);g.addColorStop(0,`hsla(${hue},60%,30%,${.12+lvl*.25})`);g.addColorStop(1,'hsla(0,0%,0%,0)');
 ctx.fillStyle=g;ctx.fillRect(-700,-700,1400,1400);
 if(gm==3)chl();else ctx.drawImage(mem,-600,-600);
 ctx.lineWidth=1.5;ctx.strokeStyle='rgba(217,178,106,.22)';ctx.beginPath();ctx.arc(0,0,545,0,TAU);ctx.stroke();
 const pr=prog();if(pr>0){ctx.lineWidth=3;ctx.strokeStyle='rgba(217,178,106,.6)';ctx.beginPath();ctx.arc(0,0,588,-Math.PI/2,-Math.PI/2+pr*TAU);ctx.stroke()}
 const pos=pc=>{const a=-Math.PI/2+(pc*7%12)*Math.PI/6;return[545*Math.cos(a),545*Math.sin(a),pc*7%12]};
 const top=[...Array(12).keys()].sort((a,b)=>C[b]-C[a]).slice(0,4).filter(i=>C[i]>.35).map(pos).sort((a,b)=>a[2]-b[2]);
 if(top.length>2){ctx.beginPath();top.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();
  ctx.fillStyle=`hsla(${hue},70%,65%,.08)`;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=`hsla(${hue},70%,65%,.7)`;ctx.stroke()}
 for(let i=0;i<12;i++){const p=pos(i);ctx.fillStyle=`hsla(${i*30},80%,65%,${.25+C[i]*.75})`;ctx.beginPath();ctx.arc(p[0],p[1],5+C[i]*14,0,TAU);ctx.fill()}
 ctx.fillStyle=`hsla(${hue},70%,70%,${.5+pulse*.5})`;ctx.beginPath();ctx.arc(0,0,9+pulse*26,0,TAU);ctx.fill()}
function loop(){if(ac&&playing()){analyse();if(gm==2)harm()}pulse*=.92;lvl*=.995;draw();requestAnimationFrame(loop)}
loop();
</script></body></html>
